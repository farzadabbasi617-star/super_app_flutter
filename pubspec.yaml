name: super_app_flutter
description: A high-performance Super App.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2

  # Functional Programming
  dartz: ^0.10.1

  # State Management
  flutter_bloc: ^8.1.3
  bloc_concurrency: ^0.2.2
  equatable: ^2.0.5

  # Routing
  go_router: ^13.0.0

  # Dependency Injection
  get_it: ^7.6.4

  # Storage & Security
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Networking
  dio: ^5.4.0
  socket_io_client: ^2.0.3

  # Geospatial & Maps
  google_maps_flutter: ^2.5.0
  google_maps_cluster_manager: ^3.0.0
  geolocator: ^10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  bloc_test: ^9.1.7
  integration_test:
    sdk: flutter
  mockito: ^5.4.4
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
