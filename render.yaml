services:
  # 1. Backend Node.js API Service connected to Neon DB
  - type: web
    name: super-app-backend
    env: node
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false

  # 2. Interactive Super App Frontend Static Site (Zero build time, instant deployment)
  - type: web
    name: super-app-web
    env: static
    staticPublishPath: .
