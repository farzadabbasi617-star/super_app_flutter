services:
  # 1. Backend Node.js API Service connected to Neon DB
  - type: web
    name: super-app-backend
    env: node
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false # Set this in Render Dashboard from your Neon PostgreSQL connection string

  # 2. Flutter Web Static Frontend Service
  - type: static
    name: super-app-frontend
    env: static
    region: frankfurt
    plan: free
    buildCommand: flutter pub get && flutter build web --release --no-wasm-dry-run
    staticPublishPath: build/web
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
